<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media management in HTML</title>
</head>
<body>
    <video src="video/01.mp4" controls width="230" ></video>
    <video src="video/02.mp4" width="230" controls></video>
    <audio src="Audio/01.mp3" controls preload="auto"></audio>
    <audio src="Audio/02.mp3" controls preload="auto" muted></audio>
    <img src="Pictures/01.jpg" alt="Penguin" width="230">

    
</body>
</html>
