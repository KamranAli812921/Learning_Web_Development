<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete HTML Form</title>
  </head>
  <body>
    <h1>Student Registration Form</h1>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Laborum fugit
      libero aspernatur nulla perferendis dolores blanditiis? Necessitatibus,
      doloremque harum. Ab, quisquam! Exercitationem architecto eos perferendis
      modi totam id ullam fuga.
    </p>

    <form action="submit.php" method="post">
      <div>
        <label for="fullname">Full Name:</label><br />
        <input
          type="text"
          id="fullname"
          name="fullname"
          placeholder="Enter your name"
          required
        />
      </div>

      <div>
        <label for="email">Email:</label><br />
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
        />
      </div>

      <div>
        <label for="password">Password:</label><br />
        <input type="password" id="password" name="password" />
      </div>

      <div>
        <label for="age">Age:</label><br />
        <input type="number" id="age" name="age" min="1" max="100" />
      </div>

      <div>
        <label for="dob">Date of Birth:</label><br />
        <input type="date" id="dob" name="dob" />
      </div>

      <div>
        <label>Gender:</label><br />

        <input type="radio" id="male" name="gender" value="Male" />
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female" />
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other" />
        <label for="other">Other</label>
      </div>

      <div>
        <label>Skills:</label><br />

        <input type="checkbox" id="html" name="skills" value="HTML" />
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="CSS" />
        <label for="css">CSS</label>

        <input type="checkbox" id="js" name="skills" value="JavaScript" />
        <label for="js">JavaScript</label>
      </div>

      <div>
        <label for="city">Select City:</label><br />
        <select id="city" name="city">
          <option value="">--Choose City--</option>
          <option value="Karachi">Karachi</option>
          <option value="Lahore">Lahore</option>
          <option value="Islamabad">Islamabad</option>
        </select>
      </div>

      <div>
        <label for="message">Message:</label><br />
        <textarea
          id="message"
          name="message"
          rows="5"
          cols="30"
          placeholder="Write something..."
        ></textarea>
      </div>

      <div>
        <label for="file">Upload File:</label><br />
        <input type="file" id="file" name="file" />
      </div>

      <div>
        <input type="submit" value="Submit" />
        <input type="reset" value="Reset" />
      </div>
    </form>
  </body>
</html>
